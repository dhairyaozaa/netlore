name: Build & Deploy NETLORE

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify API key secret
        run: |
          if [ -z "$YT_KEY" ]; then
            echo "❌ VITE_YOUTUBE_API_KEY secret is MISSING"
            echo "   Repo → Settings → Secrets and variables → Actions → New secret"
            echo "   Name:  VITE_YOUTUBE_API_KEY"
            echo "   Value: AIza..."
            exit 1
          else
            echo "✅ VITE_YOUTUBE_API_KEY found (length: ${#YT_KEY})"
          fi
        env:
          YT_KEY: ${{ secrets.VITE_YOUTUBE_API_KEY }}

      - name: Write .env
        run: |
          echo "VITE_YOUTUBE_API_KEY=${{ secrets.VITE_YOUTUBE_API_KEY }}" >> .env
          echo "VITE_APP_NAME=NETLORE" >> .env
          echo "VITE_BASE_URL=/${{ github.event.repository.name }}/" >> .env
          echo "✅ .env written"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify dist
        run: |
          echo "📦 dist/ contents:"
          ls -lh dist/
          if grep -r "AIza" dist/ --include="*.js" -l > /dev/null 2>&1; then
            echo "✅ API key baked into bundle"
          else
            echo "⚠️  API key not found in bundle"
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          enable_jekyll: false
