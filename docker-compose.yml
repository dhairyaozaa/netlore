version: '3.8'
services:
  frontend:
    build: .
    ports: ["3000:80"]
    restart: unless-stopped
  dev:
    image: node:20-alpine
    working_dir: /app
    volumes: [".:/app","/app/node_modules"]
    ports: ["5173:5173"]
    command: sh -c "npm install && npm run dev -- --host"
    profiles: [dev]
  proxy:
    image: node:20-alpine
    working_dir: /app
    volumes: [".:/app","/app/node_modules"]
    ports: ["3001:3001"]
    environment: [NODE_ENV=production]
    command: sh -c "npm install && node server/index.js"
    env_file: [.env]
    profiles: [proxy]
